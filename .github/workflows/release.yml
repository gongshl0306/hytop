name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(PYTHONPATH=src python3 -c "import dcutop; print(dcutop.__version__)")
          if [ "v${PKG_VERSION}" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package version ${PKG_VERSION}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Use the annotated tag message as release body
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > release-body.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "dcutop ${{ github.ref_name }}" \
            --notes-file release-body.md \
            --generate-notes
